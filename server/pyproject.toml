[tool.ruff]
line-length = 88
target-version = "py314"

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "**/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.black]
line-length = 88

extend-exclude = '''
(
  migrations
)
'''

[project]
name = "server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.12.1",
    "attrs==26.1.0",
    "black==26.5.1",
    "click==8.4.2",
    "django==6.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "django-filter==26.1",
    "djangorestframework==3.18.0",
    "djangorestframework-simplejwt==5.5.1",
    "faker==40.36.0",
    "gunicorn==26.0.0",
    "inflection==0.5.1",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "mypy-extensions==1.1.0",
    "packaging==26.3",
    "pathspec==1.1.1",
    "pillow==12.3.0",
    "platformdirs==4.11.1",
    "psycopg2-binary==2.9.12",
    "pyjwt==2.13.0",
    "pytokens==0.4.1",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
    "ruff==0.16.2",
    "sqlparse==0.5.5",
    "uritemplate==4.2.0",
    "whitenoise==6.12.0",
]
